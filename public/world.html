<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Pointer World</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111}#hud{position:fixed;z-index:2;top:12px;left:12px;color:#fff;background:#000b;padding:12px;font:14px ui-monospace,monospace;border-radius:8px;white-space:pre}#hint{position:fixed;z-index:2;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;background:#000b;padding:10px 16px;border-radius:999px;font:15px system-ui}#conversation{display:none;position:fixed;z-index:3;right:24px;top:24px;width:min(430px,calc(100vw - 48px));background:#101722ee;color:#fff;padding:20px;border-radius:16px;font:18px system-ui;box-shadow:0 12px 40px #0008}#conversation .you{color:#7dd3fc;margin-bottom:16px}#conversation .patient{color:#f9a8d4}#conversation strong{color:#fff}#controller-qr{position:fixed;z-index:2;right:18px;bottom:18px;background:#fff;padding:10px 10px 7px;border-radius:12px;text-align:center;font:12px system-ui;color:#111;box-shadow:0 4px 18px #0008}#controller-qr img{display:block;width:150px;height:150px}#controller-qr div{margin-top:5px;font-weight:700}</style>
<div id="hud">Waiting for phone…</div><div id="controller-qr"><img src="/controller-qr.png" alt="QR code to open phone controller"><div>SCAN FOR PHONE CONTROLLER</div></div><div id="conversation"><div class="you"><strong>YOU SAID</strong><div id="said"></div></div><div class="patient"><strong>PATIENT</strong><div id="reply"></div></div></div><div id="hint">Use the phone gamepad to move and look · INTERACT selects the object in the centre</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x182028);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.set(0,1.2,6);let camYaw=0,camPitch=-0.08;camera.rotation.order='YXZ';camera.rotation.set(camPitch,camYaw,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2.2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(4,7,5);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,10),new THREE.MeshStandardMaterial({color:0x52606b,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-1;scene.add(floor);
const table=new THREE.Mesh(new THREE.BoxGeometry(6,.25,2.4),new THREE.MeshStandardMaterial({color:0x8b6847}));table.position.set(0,-.35,0);scene.add(table);
function makeBottle(){
  const g=new THREE.Group();g.userData={interactive:true,id:'aspirin',name:'Aspirin bottle'};
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.48,.52,1.45,32),new THREE.MeshStandardMaterial({color:0xf5f5ed,roughness:.55}));body.position.y=.45;g.add(body);
  const shoulder=new THREE.Mesh(new THREE.CylinderGeometry(.34,.47,.28,32),body.material);shoulder.position.y=1.28;g.add(shoulder);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.32,32),new THREE.MeshStandardMaterial({color:0xe8e8e8,roughness:.8}));cap.position.y=1.58;g.add(cap);
  const label=new THREE.Mesh(new THREE.CylinderGeometry(.525,.525,.62,32,1,true),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.8,side:THREE.DoubleSide}));label.position.y=.55;g.add(label);
  const canvas=document.createElement('canvas');canvas.width=512;canvas.height=256;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,512,256);c.fillStyle='#b71c1c';c.fillRect(0,0,512,58);c.fillStyle='#fff';c.font='bold 34px system-ui';c.textAlign='center';c.fillText('ASPIRIN',256,41);c.fillStyle='#111';c.font='bold 25px system-ui';c.fillText('300 mg TABLETS',256,112);c.font='20px system-ui';c.fillText('For demonstration only',256,164);c.font='18px system-ui';c.fillText('24 tablets',256,207);
  const tex=new THREE.CanvasTexture(canvas);const front=new THREE.Mesh(new THREE.PlaneGeometry(.72,.55),new THREE.MeshBasicMaterial({map:tex}));front.position.set(0,.57,.526);g.add(front);
  g.position.set(0,-.18,0);return g;
}
const bottle=makeBottle();scene.add(bottle);
function makePatient(){const g=new THREE.Group();g.userData={interactive:true,id:'patient',name:'Patient'};const skin=new THREE.MeshStandardMaterial({color:0xd9a27f});const scrubs=new THREE.MeshStandardMaterial({color:0x4f86a8});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.15,8,16),scrubs);body.position.y=.35;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,24,16),skin);head.position.y=1.45;g.add(head);const eyeMat=new THREE.MeshBasicMaterial({color:0x222222});for(const x of [-.12,.12]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,10,8),eyeMat);eye.position.set(x,1.5,.31);g.add(eye)}g.position.set(2.05,-.05,0);return g}
const patient=makePatient();scene.add(patient);
const patientOutline=new THREE.Group();patient.traverse(child=>{if(child.isMesh){const edges=new THREE.EdgesGeometry(child.geometry);const lines=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xff2d95}));lines.position.copy(child.position);lines.rotation.copy(child.rotation);lines.scale.copy(child.scale).multiplyScalar(1.04);patientOutline.add(lines)}});patientOutline.position.copy(patient.position);patientOutline.visible=false;scene.add(patientOutline);
// Strong pink selection outline (POC): edge lines around every bottle mesh.
const outline=new THREE.Group();
bottle.traverse(child=>{if(child.isMesh){const edges=new THREE.EdgesGeometry(child.geometry);const lines=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xff2d95}));lines.position.copy(child.position);lines.rotation.copy(child.rotation);lines.scale.copy(child.scale).multiplyScalar(1.035);outline.add(lines)}});
outline.position.copy(bottle.position);outline.visible=false;scene.add(outline);
const tablePose={position:bottle.position.clone(),rotation:bottle.rotation.clone()};
const inspectPose=new THREE.Vector3(0,.55,2.15);let inspecting=false,inspectBase=null;
const origin=new THREE.Vector3(),dir=new THREE.Vector3(0,0,-1);
const laserGeom=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-7)]);
const laserMat=new THREE.LineBasicMaterial({color:0x00ff88});const laser=new THREE.Line(laserGeom,laserMat);scene.add(laser);
const reticle=document.createElement('div');reticle.style.cssText='position:fixed;z-index:2;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border:2px solid #00ff88;border-radius:50%;box-shadow:0 0 8px #000;pointer-events:none';document.body.appendChild(reticle);
let moveX=0,moveY=0,lastFrame=performance.now();let aimBase=null;const aimSensitivity=1.0;
// DeviceOrientation alpha/beta/gamma are Euler angles. On iOS they can jump between
// equivalent Euler representations (for example beta 2° -> 178° while alpha/gamma
// flip too). Convert the complete orientation to a quaternion before comparing it.
const deviceEuler=new THREE.Euler(),deviceQ1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),deviceQ0=new THREE.Quaternion(),deviceZ=new THREE.Vector3(0,0,1);
function deviceQuaternion(o){
  const alpha=THREE.MathUtils.degToRad(o.alpha),beta=THREE.MathUtils.degToRad(o.beta),gamma=THREE.MathUtils.degToRad(o.gamma),orient=THREE.MathUtils.degToRad(o.screenAngle||0);
  deviceEuler.set(beta,alpha,-gamma,'YXZ');
  const q=new THREE.Quaternion().setFromEuler(deviceEuler);
  q.multiply(deviceQ1);
  q.multiply(deviceQ0.setFromAxisAngle(deviceZ,-orient));
  return q;
}
function makeAimBase(o){return {q:deviceQuaternion(o),yaw:camYaw,pitch:camPitch}}
function relativeAim(base,o){
  const rel=base.q.clone().invert().multiply(deviceQuaternion(o));
  const e=new THREE.Euler().setFromQuaternion(rel,'YXZ');
  return {yaw:e.y,pitch:e.x};
}
function laserColor(hex){laserMat.color.setHex(hex);reticle.style.borderColor='#'+hex.toString(16).padStart(6,'0')}
function updateLaser(){const end=origin.clone().addScaledVector(dir,7);laser.geometry.setFromPoints([origin,end])}
const raycaster=new THREE.Raycaster();const hud=document.querySelector('#hud'),hint=document.querySelector('#hint'),conversation=document.querySelector('#conversation'),said=document.querySelector('#said'),reply=document.querySelector('#reply');let last={alpha:0,beta:0,gamma:0,screenAngle:0},hovered=false,selected=false,lastHoverTarget=null;
const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);function send(x){if(ws.readyState===1)ws.send(JSON.stringify(x))}
function hitBottle(){raycaster.set(origin,dir);return raycaster.intersectObject(bottle,true).length>0} function hitPatient(){raycaster.set(origin,dir);return raycaster.intersectObject(patient,true).length>0}
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='orientation'){if(!Number.isFinite(m.alpha)||!Number.isFinite(m.beta)||!Number.isFinite(m.gamma)||!Number.isFinite(m.screenAngle))return;last=m;if(!aimBase&&!inspecting)aimBase=makeAimBase(m)}else if(m.type==='calibrate'){aimBase=makeAimBase(last);hint.textContent='Aim calibrated — this phone position is now straight ahead'}else if(m.type==='gamepad'){if(m.control==='move'){moveX=m.x;moveY=m.y}}else if(m.type==='trigger'){if(hitBottle()&&!inspecting){selected=true;outline.visible=true;patientOutline.visible=false;laserColor(0xff2d95);hint.textContent='Aspirin selected — actions are now in the centre of the phone controller';send({type:'patientDeselected'});send({type:'selection',item:{id:'aspirin',name:'Aspirin',subtitle:'300 mg tablets'}})}else if(hitPatient()&&!inspecting){selected=false;outline.visible=false;patientOutline.visible=true;laserColor(0xff2d95);hint.textContent='Patient selected — HOLD TO TALK appears on the phone';send({type:'selection',item:null});send({type:'patientSelected'})}else if(!inspecting){selected=false;outline.visible=false;patientOutline.visible=false;send({type:'selection',item:null});send({type:'patientDeselected'});hint.textContent='Missed — point at the bottle or patient and try again'}}else if(m.type==='pickup'){selected=true;inspecting=true;outline.visible=true;inspectBase={alpha:last.alpha,beta:last.beta,gamma:last.gamma};bottle.position.copy(inspectPose);outline.position.copy(inspectPose);hint.textContent='Inspecting aspirin — rotate your phone to rotate the bottle';send({type:'pickedUp',id:'aspirin'})}else if(m.type==='putdown'){inspecting=false;selected=false;inspectBase=null;bottle.position.copy(tablePose.position);bottle.rotation.copy(tablePose.rotation);outline.position.copy(tablePose.position);outline.rotation.copy(tablePose.rotation);outline.visible=false;hint.textContent='Use left stick to move · physically aim phone · INTERACT selects centre target';send({type:'putDown',id:'aspirin'})}else if(m.type==='inspect'){hint.textContent='Bottle label opened on phone'}else if(m.type==='speech'){patientOutline.visible=true;conversation.style.display='block';said.textContent=m.text;reply.textContent='…';hint.textContent='Patient heard you';setTimeout(()=>{reply.textContent="I've got a pain in the centre of my chest."},700)}};
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(!inspecting){if(aimBase){const delta=relativeAim(aimBase,last);camYaw=aimBase.yaw+delta.yaw*aimSensitivity;camPitch=THREE.MathUtils.clamp(aimBase.pitch+delta.pitch*aimSensitivity,-1.15,1.15)}camera.rotation.set(camPitch,camYaw,0);const forward=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));const right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));camera.position.addScaledVector(right,moveX*2.4*dt);camera.position.addScaledVector(forward,-moveY*2.4*dt)}camera.getWorldPosition(origin);camera.getWorldDirection(dir);updateLaser();const bottleHover=!inspecting&&hitBottle(),patientHover=!inspecting&&hitPatient();hovered=bottleHover||patientHover;
const hoverTarget=bottleHover?'aspirin':patientHover?'patient':null;
if(hoverTarget!==lastHoverTarget){lastHoverTarget=hoverTarget;send({type:'hover',target:hoverTarget})}
if(!selected&&!patientOutline.visible)laserColor(hovered?0x66ccff:0x00ff88);
if(inspecting&&inspectBase){const yaw=THREE.MathUtils.degToRad(last.alpha-inspectBase.alpha);const pitch=THREE.MathUtils.degToRad(last.beta-inspectBase.beta);const roll=THREE.MathUtils.degToRad(last.gamma-inspectBase.gamma);bottle.rotation.set(pitch,yaw,-roll,'YXZ');outline.rotation.copy(bottle.rotation)}
hud.textContent=`POC v8.3 · ${ws.readyState===1?'PHONE CONNECTED':'WAITING FOR PHONE'}\nalpha/yaw : ${last.alpha.toFixed(1)}°\nbeta/pitch: ${last.beta.toFixed(1)}°\ngamma/roll: ${last.gamma.toFixed(1)}°\ntarget     : ${bottleHover?'ASPIRIN':patientHover?'PATIENT':'—'}\nselected   : ${selected?'YES':'NO'}
held       : ${inspecting?'YES':'NO'}\nMOVE input : ${moveX.toFixed(2)}, ${moveY.toFixed(2)}\naim mode   : PHONE ORIENTATION\ncamera x/z : ${camera.position.x.toFixed(2)}, ${camera.position.z.toFixed(2)}`;renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
