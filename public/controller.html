<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SIM Controller</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1117;color:#eee;font-family:system-ui}body{touch-action:none}.app{height:100%;display:grid;grid-template-columns:minmax(150px,26vw) 1fr minmax(150px,26vw);gap:12px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}.side{display:flex;align-items:center;justify-content:center;position:relative}.center{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.brand{position:absolute;top:4px;font-size:12px;letter-spacing:.16em;color:#8993a4}.status{font-size:12px;color:#7ee787;margin-top:5px}.stick{width:min(23vw,180px);height:min(23vw,180px);border-radius:50%;background:#1b2330;border:2px solid #39465a;position:relative;box-shadow:inset 0 0 30px #0008}.knob{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:#667085;border:2px solid #9aa4b2;box-shadow:0 5px 14px #0008}.stickLabel{position:absolute;bottom:6px;font-size:12px;letter-spacing:.12em;color:#8993a4}.panel{width:100%;max-width:430px;min-height:150px;border:1px solid #303a49;border-radius:18px;background:#151b24;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center}.panel h2{margin:0 0 5px;font-size:22px}.panel p{margin:3px 0;color:#aab3c2;font-size:13px}.actions{width:100%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;min-width:110px}.primary{background:#ff2d95;color:white}.secondary{background:#e6edf3;color:#111}.talk{background:#2563eb;color:white;min-width:180px;touch-action:none}.trigger{position:absolute;right:0;bottom:8px;width:82px;height:58px;min-width:0;padding:0;background:#ff2d95;color:#fff;border-radius:18px}.label{display:none;background:#fff;color:#111;border:2px solid #b71c1c;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12px}.label strong{display:block;color:#b71c1c;font-size:18px}.transcript{width:100%;background:#0d1117;border-radius:8px;padding:8px;margin-top:8px;min-height:34px;font-size:12px;color:#c9d1d9}.motion{position:absolute;left:0;bottom:8px;background:#242c38;color:#eee;min-width:0;padding:9px 12px;font-size:11px}.rotateHint{color:#f9a8d4!important;font-weight:700}.rightActions{width:100%;display:flex;flex-direction:column;align-items:stretch;gap:10px}.actionKey{position:static;width:100%;height:58px;min-width:0}.aimHint{margin-top:8px;text-align:center;color:#8993a4;font-size:11px;line-height:1.5;letter-spacing:.08em}.contextInfo{width:100%;margin-top:9px;padding:9px 11px;border-radius:10px;background:#0d1117;border:1px solid #303a49;color:#c9d1d9;font-size:12px;line-height:1.45}.contextInfo strong{color:#fff}.hapticSwitch{position:absolute;left:-9999px;width:1px;height:1px;opacity:.001}
@media (orientation:portrait){.app:before{content:'Rotate phone to landscape';position:fixed;inset:0;background:#0d1117;z-index:99;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}.app>*{visibility:hidden}}
</style></head><body><div class="app">
<div class="side"><div><div id="move" class="stick"><div class="knob"></div></div><div class="stickLabel">MOVE</div></div></div>
<div class="center"><div class="brand">SIM CONTROLLER <span id="status" class="status">CONNECTING…</span></div><div id="panel" class="panel"><h2 id="title">Navigation</h2><p id="subtitle">Move with left stick · physically aim the phone</p><div id="actions" class="actions"></div><div id="label" class="label"><strong>ASPIRIN</strong>300 mg TABLETS · 24 tablets<br>POC label — not medical information</div><div id="contextInfo" class="contextInfo">Aim at an object or patient to see contextual information here.</div><div id="transcript" class="transcript" style="display:none"></div></div><button id="enable" class="motion">ENABLE MOTION</button></div>
<div class="side"><div class="rightActions"><button id="trigger" class="primary actionKey">INTERACT</button><button id="calibrate" class="secondary actionKey">CALIBRATE</button><div class="aimHint">MOVE PHONE<br>TO LOOK / AIM</div></div></div>
</div><input id="hapticSwitch" class="hapticSwitch" type="checkbox" switch><label id="hapticLabel" class="hapticSwitch" for="hapticSwitch">haptic</label><script>
const $=s=>document.querySelector(s),statusEl=$('#status'),title=$('#title'),subtitle=$('#subtitle'),actions=$('#actions'),label=$('#label'),transcript=$('#transcript'),contextInfo=$('#contextInfo'),trigger=$('#trigger'),calibrate=$('#calibrate'),hapticSwitch=$('#hapticSwitch'),hapticLabel=$('#hapticLabel');
const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}`);function send(x){if(ws.readyState===1)ws.send(JSON.stringify(x))}ws.onopen=()=>statusEl.textContent='CONNECTED';ws.onclose=()=>statusEl.textContent='DISCONNECTED';
let selection=null,held=false,lastOrientation={alpha:0,beta:0,gamma:0};
let hoverTarget=null;
function hapticTick(){
  // Standard API where available (e.g. some Android browsers).
  if(typeof navigator.vibrate==='function'){try{navigator.vibrate(18);return}catch(_){}}
  // iOS Safari experiment: native switch controls produce a system haptic.
  // Triggering the associated label keeps this a graceful no-op if WebKit changes behaviour.
  try{hapticLabel.click()}catch(_){}
}
function contextFor(target){
  hoverTarget=target;
  if(selection||held)return;
  if(target==='aspirin'){
    title.textContent='Aspirin'; subtitle.textContent='300 mg tablets';
    contextInfo.innerHTML='<strong>ASPIRIN · 300 mg</strong><br>Medication bottle · Aim locked<br><span style="color:#f9a8d4">Press INTERACT for actions</span>';
  }else if(target==='patient'){
    title.textContent='James Wilson'; subtitle.textContent='54 years · Patient';
    contextInfo.innerHTML='<strong>PRESENTING COMPLAINT</strong><br>Central chest pain<br><span style="color:#f9a8d4">Press INTERACT to talk / examine</span>';
  }else{
    title.textContent='Navigation'; subtitle.textContent='Move with left stick · physically aim the phone';
    contextInfo.textContent='Aim at an object or patient to see contextual information here.';
  }
}

function btn(text,cls,fn){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;actions.appendChild(b);return b}
function navUI(){selection=null;held=false;title.textContent='Navigation';subtitle.textContent='Move with left stick · physically move phone to look';actions.innerHTML='';label.style.display='none';transcript.style.display='none';trigger.style.display='block';contextFor(hoverTarget)}
function aspirinUI(){selection='aspirin';title.textContent='Aspirin';subtitle.className='';subtitle.textContent='300 mg tablets';contextInfo.innerHTML='<strong>ASPIRIN · 300 mg</strong><br>Medication selected · Choose an action below.';actions.innerHTML='';label.style.display='none';transcript.style.display='none';btn('PICK UP','primary',()=>send({type:'pickup',id:'aspirin'}));btn('VIEW LABEL','secondary',()=>{label.style.display='block';send({type:'inspect',id:'aspirin'})})}
function heldUI(){held=true;title.textContent='Aspirin — held';contextInfo.innerHTML='<strong>IN HAND</strong><br>Move / rotate the phone to inspect the bottle.';subtitle.textContent='Rotate / tilt the phone to inspect';subtitle.className='rotateHint';actions.innerHTML='';btn('VIEW LABEL','secondary',()=>label.style.display=label.style.display==='block'?'none':'block');btn('PUT DOWN','primary',()=>send({type:'putdown',id:'aspirin'}));trigger.style.display='none'}
function patientUI(){selection='patient';title.textContent='James Wilson';contextInfo.innerHTML='<strong>JAMES WILSON · 54</strong><br>Presenting complaint: central chest pain<br>Use the phone microphone to speak to the patient.';subtitle.className='';subtitle.textContent='Phone microphone → transcript on PC';actions.innerHTML='';label.style.display='none';transcript.style.display='block';transcript.textContent='Hold TALK and speak…';const b=btn('🎤 HOLD TO TALK','talk',()=>{});wireTalk(b)}
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='hover'){const previous=hoverTarget;contextFor(m.target);if(m.target&&m.target!==previous)hapticTick()}else if(m.type==='selection'){m.item?.id==='aspirin'?aspirinUI():(!m.item&&selection==='aspirin'?navUI():0)}else if(m.type==='patientSelected')patientUI();else if(m.type==='patientDeselected'&&selection==='patient')navUI();else if(m.type==='pickedUp')heldUI();else if(m.type==='putDown')navUI()};
trigger.addEventListener('pointerdown',e=>{e.preventDefault();send({type:'trigger'})});
function joystick(el,type){
  const knob=el.querySelector('.knob');
  let active=false,lastSend=0;
  function updateXY(clientX,clientY){
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=clientX-cx,dy=clientY-cy,max=r.width*.31,len=Math.hypot(dx,dy)||1,s=Math.min(1,max/len);
    dx*=s;dy*=s;
    knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    const now=performance.now();
    if(now-lastSend>16){send({type:'gamepad',control:type,x:dx/max,y:dy/max});lastSend=now}
  }
  function end(){if(!active)return;active=false;knob.style.transform='translate(-50%,-50%)';send({type:'gamepad',control:type,x:0,y:0})}
  // Touch events are deliberately explicit here: this is the primary iPhone input path.
  el.addEventListener('touchstart',e=>{e.preventDefault();active=true;const t=e.changedTouches[0];updateXY(t.clientX,t.clientY)},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();if(!active)return;const t=e.changedTouches[0];updateXY(t.clientX,t.clientY)},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();end()},{passive:false});
  el.addEventListener('touchcancel',end,{passive:false});
  // Mouse fallback makes it easy to test from a desktop browser too.
  let mouse=false;
  el.addEventListener('mousedown',e=>{e.preventDefault();mouse=active=true;updateXY(e.clientX,e.clientY)});
  window.addEventListener('mousemove',e=>{if(mouse)updateXY(e.clientX,e.clientY)});
  window.addEventListener('mouseup',()=>{if(mouse){mouse=false;end()}});
}
joystick($('#move'),'move');
function motion(e){lastOrientation={alpha:e.alpha??0,beta:e.beta??0,gamma:e.gamma??0,screenAngle:screen.orientation?.angle??window.orientation??0};send({type:'orientation',...lastOrientation})}calibrate.onclick=()=>send({type:'calibrate'});$('#enable').onclick=async()=>{try{if(typeof DeviceOrientationEvent?.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Permission denied');window.addEventListener('deviceorientation',motion);$('#enable').textContent='MOTION ON';$('#enable').disabled=true}catch(e){$('#enable').textContent='MOTION FAILED'}};
let stream,recorder,chunks=[],recording=false;function wireTalk(b){b.addEventListener('click',e=>e.preventDefault());b.addEventListener('pointerdown',async e=>{e.preventDefault();if(recording)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const preferred=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=preferred?new MediaRecorder(stream,{mimeType:preferred}):new MediaRecorder(stream);chunks=[];recorder.ondataavailable=x=>x.data.size&&chunks.push(x.data);recorder.onstop=async()=>{const type=recorder.mimeType||chunks[0]?.type||'audio/webm',blob=new Blob(chunks,{type});stream?.getTracks().forEach(t=>t.stop());transcript.textContent='Transcribing…';try{const r=await fetch('/transcribe',{method:'POST',headers:{'Content-Type':type},body:blob}),d=await r.json();if(!r.ok)throw Error(d.error);transcript.textContent=d.text||'(No speech recognised)';if(d.text)send({type:'speech',text:d.text})}catch(err){transcript.textContent=err.message}finally{recording=false;b.textContent='🎤 HOLD TO TALK'}};recorder.start();recording=true;b.textContent='RELEASE TO SEND';transcript.textContent='Listening…'}catch(err){transcript.textContent=err.message}});const stop=e=>{e.preventDefault();if(recording&&recorder?.state==='recording')recorder.stop()};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop)}
</script></body></html>
